<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
    {%- include head.html -%}
<body>
    <header>
        <h1 class="site-title">
            <a href="{{ '/' | relative_url }}">
                {{ site.title }}
            </a>
        </h1>
        <nav>
            <button
                    onclick="(() => {
              const html = document.documentElement
              if (html.classList.contains('theme-light')) {
                  html.classList.remove('theme-light')
                  html.classList.add('theme-dark')
              } else {
                  html.classList.remove('theme-dark')
                  html.classList.add('theme-light')
              }
            })()"
            >toggle theme</button>
        </nav>
    </header>
    <main>
        <aside>
            <nav>
                <ol>
                    <li><a href="{{ 'the-formula' | relative_url }}">how bakers think</a></li>
                    <li><a href="{{ 'steps-in-breadmaking' | relative_url }}">the 12 steps</a></li>
                    <li><a href="{{ 'mixing-methods' | relative_url }}">into the mix</a></li>
                    <li><a href="{{ 'baking-guidelines' | relative_url }}">fire it up</a></li>
                    <li><a href="{{ 'pre-fermented-dough' | relative_url }}">the ol' dough</a></li>
                </ol>
            </nav>
        </aside>
        <section>
            <h1>{{ page.title }}</h1>
            {{ content }}
        </section>
    </main>
    <footer>
        {{ site.description }}
    </footer>
</body>
</html>
